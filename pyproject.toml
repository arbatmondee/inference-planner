[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-planner"
version = "0.1.0"
description = "Hardware + model + inference-runtime analysis and deployment planning library"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Atharva Arbat", email = "arbatatharva130@gmail.com" }]
dependencies = [
    "psutil>=5.9",
    "packaging>=21",
]

[project.optional-dependencies]
huggingface = [
    "huggingface_hub>=0.20",
    "safetensors>=0.4",
]
nvidia = [
    "nvidia-ml-py>=12.535",
]
vllm = [
    "vllm",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
all = [
    "inference-planner[huggingface,nvidia,vllm]",
]

[project.scripts]
inference-planner = "inference_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
